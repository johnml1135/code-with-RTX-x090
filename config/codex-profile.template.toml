# Copy to the user's opt-in Codex profile location. Do not replace the normal
# cloud profile and do not put a real credential in this file.
[model_providers.bonsai_local]
name = "Bonsai local loopback"
base_url = "http://127.0.0.1:8080/v1"
wire_api = "responses"
env_key = "BONSAI_LOCAL_API_KEY"

[profiles.bonsai_local]
model_provider = "bonsai_local"
model = "bonsai2-27b"
model_reasoning_effort = "medium"
network_access = false
approval_policy = "on-request"

